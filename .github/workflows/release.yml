name: Release

# Build and publish a release whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"

          # Stage the addon inside a "Chronolog" folder so the zip extracts
          # straight into the user's Interface/AddOns directory.
          mkdir -p "build/Chronolog"
          cp Core.lua UI.lua Widget.lua Chronolog.toc README.md LICENSE "build/Chronolog/"

          # Stamp the packaged .toc version to match the tag (without the
          # leading "v"), e.g. tag v1.2.0 -> "## Version: 1.2.0". The repo file
          # is left untouched; only the zipped copy is changed.
          VERSION_NUM="${VERSION#v}"
          sed -i "s/^## Version:.*/## Version: ${VERSION_NUM}/" "build/Chronolog/Chronolog.toc"
          echo "Packaged .toc version:"
          grep "^## Version:" "build/Chronolog/Chronolog.toc"

          ( cd build && zip -r "../Chronolog-${VERSION}.zip" "Chronolog" )
          echo "Built Chronolog-${VERSION}.zip"
          unzip -l "Chronolog-${VERSION}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "Chronolog-${GITHUB_REF_NAME}.zip" \
            --title "Chronolog ${GITHUB_REF_NAME}" \
            --generate-notes
